[package]
name = "OnduleoWebApi"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = {version = "1.54.1", features = ["full"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
typst = "0.13"
typst-pdf = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
